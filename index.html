<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BERSAMASENAA</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#59466b;background:#faf7fc}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#e8daf5;color:#59466b}input,select,textarea{width:100%;padding:10px;border:1px solid #e0d7e9;border-radius:9px;background:white;color:inherit}label{display:grid;gap:5px;font-size:13px}h1,h2,h3{margin:0 0 14px}small{color:#82738f}.center{max-width:420px;margin:12vh auto;padding:30px;text-align:center;background:white;border-radius:24px}.sidebar{position:fixed;width:235px;inset:0 auto 0 0;background:#eee5f7;padding:22px;display:flex;flex-direction:column;gap:8px;overflow:auto}.sidebar button{text-align:left;background:transparent}.sidebar button.active{background:#dccbec}.main{margin-left:235px;padding:24px;max-width:1500px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #68508009}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.blue{background:#dceaff}.pink{background:#f9deeb}.hero{background:#e9dcf5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee} .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:80px;background:white;border-radius:8px;padding:5px;overflow-wrap:anywhere;font-size:12px}.event{display:block;padding:3px;margin:3px 0;border-radius:5px}.error{color:#a12c4b;white-space:pre-wrap}.mobile{display:none} [hidden]{display:none!important}@media(max-width:720px){.sidebar{z-index:5;transform:translateX(-100%);transition:.2s;box-shadow:0 0 30px #0002}.sidebar.open{transform:none}.main{margin:0;padding:14px}.mobile{display:inline-block}.day{min-height:65px}.center{margin:8vh 15px}.calendar{gap:2px}}
</style><body><div id="login" class="center"><h1>🌴 BERSAMASENAA</h1><p>Travel & Companion Lombok</p><button id="google">Masuk dengan Google</button><p id="loginError" class="error"></p></div><div id="choose" class="center" hidden><h2>Who's on duty today? 🌷</h2><button class="blue" data-profile="Mince">Mince 💙</button> <button class="pink" data-profile="Minna">Minna 🩷</button><p><button id="chooseOut">Keluar</button></p></div><div id="app" hidden><aside class="sidebar" id="side"><h3>🌴 BERSAMASENAA</h3><small>Travel & Companion Lombok</small><nav id="nav" style="display:grid;gap:6px"></nav><div style="flex:1"></div><strong id="who"></strong><button id="switch">Ganti profil</button><button id="out">Keluar</button></aside><main class="main"><div class="row spread"><button class="mobile" id="menu">☰ Menu</button><h2 id="heading"></h2><small id="sync">Menghubungkan...</small></div><p id="err" class="error"></p><div id="content"></div></main></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyBi5jR5LwwmFCPgto8mxqXlGvlbL0Bi2Bk',authDomain:'bersamasenaa.firebaseapp.com',projectId:'bersamasenaa',storageBucket:'bersamasenaa.firebasestorage.app',messagingSenderId:'173691471822',appId:'1:173691471822:web:d0a6d1bbcb4480dfdc0d9f'};
const auth=getAuth(initializeApp(config)),db=getFirestore(),allowed='ratnasella222@gmail.com';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=d=>{let p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Makassar',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};const today=()=>dateKey(new Date());const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);const profiles=['Mince','Minna'],statuses=['Pending','Confirmed','On Trip','Completed','Cancelled'],services=['Teman Jalan','Airport Pickup','Airport Drop-off','Transport Antar Jemput','Private Trip','Custom Trip'],rates={Jam:[40000,70000,100000,120000,140000,160000,170000,180000,185000,190000,195000,200000],Hari:[250000,375000,500000,625000,750000,875000,1000000]};let profile='',tab='Dashboard',data={bookings:[],blocked:[],audit:[]},unsubs=[],editing=null,month=today().slice(0,7),ready=new Set();const tabs=['Dashboard','Booking','Kalender','Jadwal Petugas','Riwayat','Pelanggan','Pengaturan'];function error(e){$('err').textContent=e.message||e}function show(id){for(const x of ['login','choose','app'])$(x).hidden=x!==id} $('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginError').textContent=e.message}};onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];ready.clear();data={bookings:[],blocked:[],audit:[]};profile='';if(!u){show('login');return}if(u.email!==allowed||!u.emailVerified){$('loginError').textContent='Akun tidak diizinkan.';await signOut(auth);return}show('choose');for(const k of Object.keys(data))unsubs.push(onSnapshot(collection(db,k),s=>{data[k]=s.docs.map(d=>({...d.data(),id:d.id}));ready.add(k);$('sync').textContent=ready.size===3?'Tersinkron':'Menghubungkan...';if(profile&&tab==='Booking'&&$('bookingForm')&&k==='bookings'){$('bookingList').innerHTML=table(sorted().filter(b=>($('filter').value==='Semua'||b.status===$('filter').value)&&[b.customer,b.service,b.whatsapp].join(' ').toLowerCase().includes($('search').value.toLowerCase())),true);editBind()}if(profile&&!(tab==='Booking'&&$('bookingForm'))&&!(tab==='Jadwal Petugas'&&$('blockForm')?.contains(document.activeElement)))render()},e=>{$('sync').textContent='Gagal sinkron';error(e)}))});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{profile=b.dataset.profile;tab='Dashboard';editing=null;$('who').textContent=profile+' • Co-owner';show('app');render()});$('out').onclick=$('chooseOut').onclick=()=>signOut(auth);$('switch').onclick=()=>{profile='';show('choose')};$('menu').onclick=()=>$('side').classList.toggle('open');function go(t){tab=t;editing=null;$('side').classList.remove('open');render()}const options=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const field=(n,l,v='',type='text',req=false)=>`<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${req?'required':''}></label>`;const sel=(n,l,a,v)=>`<label>${l}<select name="${n}">${options(a,v)}</select></label>`;const active=b=>b.status!=='Cancelled';const upcoming=b=>active(b)&&b.status!=='Completed'&&b.endDate>=today();const sorted=()=>[...data.bookings].sort((a,b)=>(a.startDate+a.startTime).localeCompare(b.startDate+b.startTime));function table(rows,edit=false){return `<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Pelanggan</th><th>Layanan</th><th>Paket</th><th>Harga referensi</th><th>Penerima</th><th>Petugas</th><th>Status</th>${edit?'<th>Aksi</th>':''}</tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.startDate)} ${esc(b.startTime)}</td><td>${esc(b.customer)}</td><td>${esc(b.service)}</td><td>${esc(b.duration)} ${esc(b.packageType)}</td><td>${money(b.price)}</td><td>${esc(b.receivedBy)}</td><td><span class="event ${b.assignedTo==='Mince'?'blue':'pink'}">${esc(b.assignedTo)}</span></td><td>${esc(b.status)}</td>${edit?`<td><button data-edit="${esc(b.id)}">Edit / Alihkan</button></td>`:''}</tr>`).join('')}</tbody></table></div>${rows.length?'':'<p>Belum ada booking.</p>'}`}
function render(){if(!profile)return;$('heading').textContent=tab;$('nav').innerHTML=tabs.map((t,i)=>`<button class="${t===tab?'active':''}" data-tab="${t}">${['⌂','▤','▦','♧','◷','♙','⚙'][i]} &nbsp;${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));let html='';if(tab==='Dashboard'){let a=data.bookings.filter(active),u=a.filter(upcoming);html=`<div class="card hero"><h1>Hello, ${profile}! 🌷</h1>Ready for another beautiful journey?</div><div class="grid">${[['Total Booking',a.length,'hero'],['Upcoming',u.length,''],['Booking Mince',u.filter(b=>b.assignedTo==='Mince').length,'blue'],['Booking Minna',u.filter(b=>b.assignedTo==='Minna').length,'pink']].map(([l,n,c])=>`<div class="card ${c}"><small>${l}</small><h1>${n}</h1></div>`).join('')}</div><div class="card"><h3>Jadwal hari ini</h3>${table(sorted().filter(b=>active(b)&&b.startDate<=today()&&b.endDate>=today()))}</div><div class="card"><div class="row spread"><h3>Upcoming Trips</h3><button id="newBooking">+ Booking</button></div>${table(sorted().filter(upcoming))}</div>`}else if(tab==='Booking'){let b=editing||{};html=`<div class="card"><h3>${editing?'Edit / Alihkan':'Tambah'} Booking</h3><form id="bookingForm"><div class="formgrid">${field('customer','Nama pelanggan',b.customer,'text',true)}${field('whatsapp','WhatsApp',b.whatsapp,'tel')}${sel('service','Jenis layanan',services,b.service)}${sel('packageType','Kategori paket',['Jam','Hari'],b.packageType)}${field('duration','Durasi',b.duration||1,'number',true)}${field('startDate','Tanggal mulai',b.startDate||today(),'date',true)}${field('startTime','Jam mulai',b.startTime||'09:00','time',true)}${field('pickup','Lokasi jemput',b.pickup)}${field('destination','Tujuan',b.destination)}${sel('receivedBy','Penerima booking',profiles,b.receivedBy||profile)}${sel('assignedTo','Petugas perjalanan',profiles,b.assignedTo||profile)}${sel('status','Status',statuses,b.status)}<label>Catatan<textarea name="notes">${esc(b.notes)}</textarea></label></div><p id="price"></p><p><button type="submit">Simpan booking</button> <button type="button" id="reset">Batal / Reset</button></p></form></div><div class="card"><h3>Daftar Booking</h3><div class="row"><input id="search" placeholder="Cari pelanggan / layanan"><select id="filter">${options(['Semua',...statuses])}</select></div><div id="bookingList">${table(sorted(),true)}</div></div>`}else if(tab==='Kalender'){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();html=`<div class="card"><div class="row spread"><button id="prev">‹</button><h3>${month}</h3><button id="next">›</button></div><div class="calendar">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<small>${d}</small>`).join('')}${'<div></div>'.repeat(first)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0');return `<div class="day">${i+1}${sorted().filter(b=>active(b)&&b.startDate<=d&&b.endDate>=d).map(b=>`<span class="event ${b.assignedTo==='Mince'?'blue':'pink'}">${esc(b.customer)} · ${esc(b.assignedTo)}</span>`).join('')}</div>`}).join('')}</div><p>💙 Mince &nbsp; 🩷 Minna</p></div>`}else if(tab==='Jadwal Petugas'){html=profiles.map(p=>`<div class="card ${p==='Mince'?'blue':'pink'}"><h3>${p}</h3>${table(sorted().filter(b=>upcoming(b)&&b.assignedTo===p))}</div>`).join('')+`<div class="card"><h3>Blok tanggal tidak tersedia</h3><form id="blockForm" class="formgrid">${sel('profile','Petugas',profiles,profile)}${field('start','Mulai',today(),'date',true)}${field('end','Selesai',today(),'date',true)}${field('reason','Alasan')}<button>Simpan blok</button></form>${data.blocked.map(b=>`<p>${esc(b.profile)} · ${esc(b.start)} – ${esc(b.end)} · ${esc(b.reason)} <button data-unblock="${esc(b.id)}">Hapus blok</button></p>`).join('')}</div>`}else if(tab==='Riwayat'){html=data.audit.slice().sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0)).map(a=>`<div class="card"><strong>${esc(a.profile)} · ${esc(a.action)}</strong><p>${esc(a.detail)}</p><small>${a.at?new Date(a.at.seconds*1000).toLocaleString('id-ID',{timeZone:'Asia/Makassar'}):'Menyimpan...'}</small></div>`).join('')||'<p>Belum ada aktivitas.</p>'}else if(tab==='Pelanggan'){let map=new Map();for(let b of data.bookings){let k=b.whatsapp||b.customer;let a=map.get(k)||{...b,count:0};a.count++;map.set(k,a)}html=[...map.values()].map(b=>`<div class="card"><strong>${esc(b.customer)}</strong><p>${esc(b.whatsapp)} · ${b.count} booking</p></div>`).join('')||'<p>Belum ada pelanggan.</p>'}else{html=`<div class="card"><h3>Pengaturan</h3><p>Profil aktif: ${profile}</p><p>Tema: Pastel biru, pink, lavender</p><p>Database: Firebase Firestore</p><p>Zona waktu: WITA</p><button id="changeProfile">Ganti profil</button></div>`}$('content').innerHTML=html;bind()}
function bind(){if($('newBooking'))$('newBooking').onclick=()=>go('Booking');if($('changeProfile'))$('changeProfile').onclick=()=>$('switch').click();if($('prev'))for(const [id,n] of [['prev',-1],['next',1]])$(id).onclick=()=>{let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()};if($('bookingForm')){let f=$('bookingForm');const price=()=>{let x=Object.fromEntries(new FormData(f));$('price').textContent='Harga referensi: '+money(rates[x.packageType][Number(x.duration)-1])+' · Kelebihan durasi Rp20.000/jam'};f.oninput=price;price();f.onsubmit=save;$('reset').onclick=()=>{editing=null;render()};const filter=()=>{$('bookingList').innerHTML=table(sorted().filter(b=>($('filter').value==='Semua'||b.status===$('filter').value)&&[b.customer,b.service,b.whatsapp].join(' ').toLowerCase().includes($('search').value.toLowerCase())),true);editBind()};$('search').oninput=$('filter').onchange=filter;editBind()}if($('blockForm'))$('blockForm').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));try{if(b.end<b.start)throw Error('Tanggal selesai tidak valid');if(data.bookings.some(x=>['Confirmed','On Trip'].includes(x.status)&&x.assignedTo===b.profile&&x.startDate<=b.end&&x.endDate>=b.start))throw Error('Ada booking aktif pada tanggal tersebut');await commit('blocked',null,b,'BLOCK',b.profile+' '+b.start);render()}catch(e){error(e)}};document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus blok tanggal?'))try{await commit('blocked',b.dataset.unblock,null,'UNBLOCK','Hapus blok');render()}catch(e){error(e)}})}function editBind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=data.bookings.find(x=>x.id===b.dataset.edit);render();window.scrollTo(0,0)})}async function commit(k,id,value,action,detail){if(ready.size!==3)throw Error('Tunggu database tersinkron.');let batch=writeBatch(db),ref=id?doc(db,k,id):doc(collection(db,k));if(value===null)batch.delete(ref);else batch.set(ref,{...value,updatedAt:serverTimestamp()});batch.set(doc(collection(db,'audit')),{profile,action,detail,recordId:ref.id,at:serverTimestamp()});await batch.commit()}
async function save(e){e.preventDefault();let btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{let b=Object.fromEntries(new FormData(e.target));b.duration=Number(b.duration);b.price=rates[b.packageType][b.duration-1];if(!b.price)throw Error('Durasi paket tidak valid.');let d=new Date(b.startDate+'T'+b.startTime+':00+08:00');if(b.packageType==='Hari'){d=new Date(b.startDate+'T00:00:00+08:00');d.setTime(d.getTime()+(b.duration-1)*86400000);b.startTime='00:00';b.endTime='23:59'}else{d.setTime(d.getTime()+b.duration*3600000);b.endTime=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}b.endDate=dateKey(d);if(['Confirmed','On Trip'].includes(b.status)){if(data.blocked.some(x=>x.profile===b.assignedTo&&x.start<=b.endDate&&x.end>=b.startDate))throw Error('Petugas tidak tersedia.');if(data.bookings.some(x=>x.id!==editing?.id&&x.assignedTo===b.assignedTo&&['Confirmed','On Trip'].includes(x.status)&&x.startDate+x.startTime<b.endDate+b.endTime&&x.endDate+x.endTime>b.startDate+b.startTime))throw Error('Jadwal petugas bentrok.')}await commit('bookings',editing?.id,b,editing?(editing.assignedTo!==b.assignedTo?'TRANSFER':'UPDATE'):'CREATE',b.customer+' · '+b.assignedTo);editing=null;$('err').textContent='';render()}catch(e){error(e)}finally{btn.disabled=false}}
</script></body></html>
